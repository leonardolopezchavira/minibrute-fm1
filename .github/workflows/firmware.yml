# The FM-1 firmware (app/, on fm1-base), built with JieLi's toolchain by the shared fm1-build workflow: every push
# that touches it builds release app/VERSION (the run's "packages" artifact), runs the host simulator's tests and
# publishes the site on GitHub Pages: the web installer, the emulator, the manual. A v* tag also makes a release.
name: firmware

on:
  push:
    branches: [main]
    paths: ['app/**', 'fm1/**', 'tools/**', '.github/workflows/firmware.yml']
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    uses: zvenson/fm1-build/.github/workflows/build.yml@v1
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      build: |
        python3 fm1/base/tools/build.py app --release "$(cat app/VERSION)"
        for m in pro elite mke; do   # the M-Vave SMK-37's three (fm1-base BOARD=smk37: app/smk37)
          BOARD=smk37 MODEL=$m python3 fm1/base/tools/build.py app --release "$(cat app/VERSION)"
        done
      packages: app/build/*.fwsc
      test: |
        python3 fm1/base/tools/build.py app --host
        app/build/host/mb1_host app/tests/basic.txt app/build/host
        BOARD=smk37 python3 fm1/base/tools/build.py app --host
        app/build/host/mb1-smk37_host app/tests/smk37.txt app/build/host
      tests-block: false

  # the site on GitHub Pages (Settings > Pages > Source: GitHub Actions)
  site:
    needs: build
    if: github.ref_type != 'tag'   # (a tag's commit is on main and already published; Pages takes main only)
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install Pillow
      - run: sudo apt-get install -y clang lld   # (the editor's engine: clang --target=wasm32, wasm-ld)
      - uses: mymindstorm/setup-emsdk@v14
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: pkg
      - name: Emulator and site
        run: |
          V="$(cat app/VERSION)"
          python3 fm1/base/tools/build.py app --web --release "$V"
          python3 fm1/base/tools/make_site.py app "$(find pkg -name "*.fwsc" | grep -v smk37 | head -1)" "$V" app/build/site
          python3 tools/make_smk_install.py pkg "$V" app/build/site
          sed "s/{{VERSION}}/$V/g" app/smk37/index.html > app/build/site/smk37/index.html
          python3 tools/make_home.py app/build/site "$V"
          sh tools/build_editor.sh app/build/site/edit
          python3 tools/site_theme.py app/build/site
          python3 tools/make_cheat.py app/build/site/cheat "$V"   # (after the theme: a print page of its own; Chrome prints the PDF)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/site
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true   # (GitHub's artifact lookup fails now and then: a second try, a minute later)
      - if: steps.deploy.outcome == 'failure'
        run: sleep 60
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
