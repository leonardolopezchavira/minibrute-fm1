# MB-1 build settings (fm1-base tools/build.py)
name = "MB1"
id_prefix = "FM-1_49"          # package identity: dev FM-1_4900, releases FM-1_49XXYYZZ (FM-1_42 is MODELAR's on the hub)
usb_manufacturer = "minibrute-fm1"
usb_product = "MB-1 FM-1"
o2 = ["mbvoice/mbvoice.c", "mbvoice/mbfx.c"]   # the engine and the effects, at -O2
o2_cflags = ["-DMB_FASTMATH"]  # fm1-base's fastmath.h in place of libm
include = ["mbvoice"]
words = "words.tsv"
backup = true                  # backup and restore over USB (the site's backup/ page): patches, patterns, settings
backup_ext = "mb1"
backup_holds = "MB-1's 128 patches, its 8 sequencer patterns and its settings"
ble = true                     # Bluetooth MIDI in and out
cpu2 = true                    # the second core: the delay and the reverb
cpu2_fallback = true           # a unit whose second core misreads: one core (the effects on the first)
tagline = "an aggressive monophonic virtual analog synth for the FM-1"
repo = "https://github.com/leonardolopezchavira/minibrute-fm1"
licence = "MIT"
credits = "Built on fm1-base (MPL-2.0) and felucca-bsp, after Felucca by Leo Kuroshita, Hügelton Instruments."
author = "Leonardo Lopez Chavira"
description = "An unofficial, aggressive monophonic virtual analog synth for the FM-1, after the MiniBrute and measured against Arturia's MiniBrute V: sawtooth with Ultrasaw, square with PWM, triangle with Metalizer, sub and noise; a resonant multimode filter with Brute Factor; two ADSRs, an LFO, vibrato and glide; an arpeggiator, a 64-step sequencer, five effects and 128 patch slots, with a patch editor in the browser."
tags = ["synth"]
install = "https://leonardolopezchavira.github.io/minibrute-fm1/install/"
site = "https://leonardolopezchavira.github.io/minibrute-fm1/"
screenshot = "docs/img/screen-playing.png"
